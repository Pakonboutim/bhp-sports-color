<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบ Staff กีฬาสี</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="sports.css?v=20260916-print2"></head>
<body class="sports-page staff-page">
  <header id="staff-banner" class="team-banner"><h1 id="staff-title">STAFF</h1><p>ระบบจัดการทีมกีฬาสี</p></header>
  <main class="sports-main">
    <div id="staff-login" class="sports-card staff-login"><h2>เข้าสู่ระบบ Staff</h2><p>กรอกรหัสประจำสีเพื่อดูและจัดการข้อมูลทีม</p><div class="field"><label>รหัส Staff</label><input id="staff-key" type="password" autocomplete="current-password"></div><button id="staff-login-btn" class="primary">เข้าสู่ระบบ</button><div id="staff-login-error" class="notice" hidden></div></div>
    <div id="staff-app" hidden>

        <button data-view="overview" class="active">🏠 ภาพรวม</button><button data-view="students">🎒 นักเรียน</button><button data-view="teachers">👩‍🏫 ครู</button><button data-view="register">🏃 ลงนักกีฬา</button><button data-view="athletes">📋 นักกีฬา</button><button data-view="results">🏆 ผลแข่งขัน</button>
      </nav>
      <section id="staff-overview" class="staff-view active"></section>
      <section id="staff-students" class="staff-view"></section>
      <section id="staff-teachers" class="staff-view"></section>
      <section id="staff-register" class="staff-view"></section>
      <section id="staff-athletes" class="staff-view"></section>
      <section id="staff-results" class="staff-view"></section>
    </div>
  </main>
  <div id="staff-print-area"></div><script src="sports.js?v=20260916-supabase4"></script><script src="staff.js?v=20260916-print2"></script>
