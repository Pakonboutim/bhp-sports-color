<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>กรรมการตัดสินกีฬาสี</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="sports.css"></head><body class="sports-page"><header class="sports-header"><div class="sports-header-inner"><div>⚖️</div><div><h1>กรรมการตัดสิน</h1><p>บันทึกและยืนยันผลการแข่งขัน</p></div></div></header><main class="sports-main"><form id="referee-form" class="sports-card"><div class="field"><label>กีฬา</label><select id="ref-sport" required></select></div><div class="field"><label>คู่แข่งขัน</label><select id="ref-match" required></select></div><div class="grid grid-2"><div class="field"><label id="label-a">คะแนนทีม A</label><input id="score-a" type="number" min="0" required></div><div class="field"><label id="label-b">คะแนนทีม B</label><input id="score-b" type="number" min="0" required></div></div><div class="field"><label>ชื่อกรรมการ</label><input id="referee-name" required maxlength="100"></div><div class="notice">เมื่อยืนยันแล้ว ผลจะถูกล็อกและสายการแข่งขันจะอัปเดตทันที</div><button class="primary" type="submit" style="width:100%">ยืนยันผลการแข่งขัน</button></form></main><script src="sports.js"></script><script src="referee.js"></script></body></html>
